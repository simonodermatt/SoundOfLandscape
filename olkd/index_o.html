<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Panorama Synthesizer Karte</title>
    <!-- CSS für die Karte -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        .popup-content { text-align: center; }
        /* Damit das Bild schön in die Sprechblase passt */
        .popup-img { width: 100%; border-radius: 4px; display: block; }
        /* Container für Bild und die Canvas-Zeichenfläche darüber */
        .bild-container { position: relative; width: 100%; margin-bottom: 10px; }
        #punktOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        button { margin-top: 10px; padding: 8px 16px; cursor: pointer; background: #333; color: white; border: none; border-radius: 4px;}
        button:hover { background: #555; }
    </style>
</head>
<body>

<!-- Der Bereich, in dem die Karte gezeichnet wird -->
<div id="map"></div>

<!-- JavaScript für die Karte -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    // 1. Karte initialisieren
    const map = L.map('map').setView([46.8182, 8.2275], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // 2. Audio Context und Tonleiter (Lydisch) vorbereiten
    let audioCtx;
    const tonleiter = [130.81, 146.83, 164.81, 185.00, 196.00, 220.00, 246.94, 261.63, 293.66, 329.63, 369.99, 392.00, 440.00, 493.88, 523.25];

    // 3. Hilfsfunktionen: Gipfel und Täler inkl. X-Koordinate finden
    function findeGipfel(kurve, anzahlPeaks) {
        let gefundenePeaks = [];
        for (let i = 1; i < kurve.length - 1; i++) {
            // Plateau-tolerant für breite Bergkuppen
            if (kurve[i] >= kurve[i - 1] && kurve[i] > kurve[i + 1]) {
                gefundenePeaks.push({ x: i, hoehe: kurve[i] }); 
            }
        }
        gefundenePeaks.sort((a, b) => b.hoehe - a.hoehe);
        return gefundenePeaks.slice(0, anzahlPeaks);
    }

    function findeTaeler(kurve, anzahl) {
        let gefundeneTaeler = [];
        for (let i = 1; i < kurve.length - 1; i++) {
            // Plateau-tolerant für breite Täler
            if (kurve[i] <= kurve[i - 1] && kurve[i] < kurve[i + 1]) {
                gefundeneTaeler.push({ x: i, hoehe: kurve[i] });
            }
        }
        gefundeneTaeler.sort((a, b) => a.hoehe - b.hoehe);
        return gefundeneTaeler.slice(0, anzahl);
    }

    // 4. Marker auf die Karte setzen
    const marker = L.marker([46.5595, 7.9666]).addTo(map);
    
    // Dateinamen definieren
    const basisName = 'IMG_2828';
    const jsonPfad = `daten/${basisName}_array.json`;
    const bildPfad = `daten/${basisName}_linie.jpg`;

    // Popup mit Bild, Canvas, Slidern und Button zusammenbauen
    marker.bindPopup(`
        <div class="popup-content">
            <h3>Panorama Kontur</h3>
            
            <div class="bild-container">
                <img src="${bildPfad}" alt="Bergsilhouette" class="popup-img" />
                <canvas id="punktOverlay"></canvas>
            </div>
            
            <div style="margin: 10px 0; text-align: left;">
                <label style="font-size: 14px;">Gipfel (Melodie): <b id="peakWert">4</b></label><br>
                <input type="range" id="peakSlider" min="0" max="10" value="4" style="width: 100%;" 
                       oninput="document.getElementById('peakWert').innerText = this.value">
                
                <label style="font-size: 14px; margin-top:5px; display:block;">Täler (Bass): <b id="talWert">2</b></label>
                <input type="range" id="talSlider" min="0" max="10" value="2" style="width: 100%;" 
                       oninput="document.getElementById('talWert').innerText = this.value">
            </div>

            <button onclick="playPanorama('${jsonPfad}')">🎵 Akkord abspielen</button>
        </div>
    `, { maxWidth: 320 });

    // 5. Die Hauptfunktion: Synthesizer und Grafik zeichnen
    async function playPanorama(dateiPfad) {
        
        // A. Synthesizer initialisieren und aufwecken
        if (!audioCtx) { 
            audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
        }
        if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
        }

        try {
            // B. Daten laden
            const response = await fetch(dateiPfad);
            if (!response.ok) {
                throw new Error(`Datei nicht gefunden! HTTP-Status: ${response.status}`);
            }
            const daten = await response.json();
            const kurve = daten.kurve_y;

            // C. Regler ablesen und beide Punktarten berechnen
            const anzahlGipfel = parseInt(document.getElementById('peakSlider').value);
            const anzahlTaeler = parseInt(document.getElementById('talSlider').value);
            
            const topGipfel = findeGipfel(kurve, anzahlGipfel);
            const tiefeTaeler = findeTaeler(kurve, anzahlTaeler);
            const allePunkte = topGipfel.concat(tiefeTaeler);

            // --- NEU: DIE GRAFISCHE DARSTELLUNG ---
            const canvas = document.getElementById('punktOverlay');
            const ctx = canvas.getContext('2d');
            
            // Die interne Auflösung des Canvas exakt auf dein Original-Bild anpassen
            canvas.width = daten.bild_breite; 
            canvas.height = daten.bild_hoehe;
            
            // Alte Striche löschen
            ctx.clearRect(0, 0, canvas.width, canvas.height); 

            // Gipfel zeichnen (Goldgelbe Linien)
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.8)';
            ctx.lineWidth = 4;
            topGipfel.forEach(punkt => {
                ctx.beginPath();
                ctx.moveTo(punkt.x, 0); 
                ctx.lineTo(punkt.x, canvas.height); 
                ctx.stroke();
            });

            // Täler zeichnen (Hellblaue Linien)
            ctx.strokeStyle = 'rgba(0, 191, 255, 0.8)';
            tiefeTaeler.forEach(punkt => {
                ctx.beginPath();
                ctx.moveTo(punkt.x, 0);
                ctx.lineTo(punkt.x, canvas.height);
                ctx.stroke();
            });

            // D. Höhen in Frequenzen umwandeln und abspielen
            allePunkte.forEach(punkt => {
                // Welcher Tonleiter-Index passt zur Höhe?
                const index = Math.floor((punkt.hoehe / 100) * (tonleiter.length - 1));
                const freq = tonleiter[index];

                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'triangle';
                oscillator.frequency.value = freq;

                // Sanftes Ein- und Ausblenden des Tons
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 1.5); 
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 4.5);   

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 5);
            });

        } catch (error) {
            console.error("Fehler beim Laden:", error);
            alert("Fehler: " + error.message); 
        }
    }
</script>

</body>
</html>
