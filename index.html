<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Panorama Synthesizer Karte</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232c3e50'/><path d='M15,75 L35,30 L55,55 L75,20 L85,60' fill='none' stroke='%23FFD700' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/><circle cx='55' cy='55' r='8' fill='%2300BFFF'/></svg>">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
    
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; position: relative; }
        
        #ui-menu {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 10px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            font-size: 13px;
            border: 1px solid #ddd;
        }
        
        #ui-menu select {
            width: 100%;
            padding: 4px;
            margin-top: 2px;
            margin-bottom: 6px;
            border-radius: 3px;
            border: 1px solid #ccc;
            font-size: 13px;
        }
        
        #ui-menu select:last-child { margin-bottom: 0; }
        #ui-menu label { font-size: 12px; color: #555; }

        .popup-content { text-align: center; }
        .popup-img { width: 100%; border-radius: 4px; display: block; }
        
        .bild-container { position: relative; width: 100%; margin-bottom: 10px; cursor: zoom-in; }
        .punktOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        .popup-content select, .popup-content input[type="range"] {
            width: 100%;
            margin-top: 2px;
            margin-bottom: 6px;
        }
        .popup-content label {
            display: block;
            text-align: left;
            font-size: 11px;
            margin-top: 4px;
            color: #444;
        }

        button.play-btn { 
            margin-top: 10px; padding: 10px 16px; cursor: pointer; 
            background: #2c3e50; color: white; border: none; 
            border-radius: 4px; font-weight: bold; width: 100%;
        }
        button.play-btn:hover { background: #1a252f; }

        #lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        #lightbox img {
            max-width: 95vw;
            max-height: 95vh;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div id="ui-menu">
    <label id="lbl-sprache" for="langSelect">Sprache:</label>
    <select id="langSelect" onchange="changeLanguage(this.value)">
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="it">Italiano</option>
        <option value="en">English</option>
        <option value="uk">Українська</option>
        <option value="ru">Русский</option>
    </select>

    <label id="lbl-view" for="kartenAnsicht"><b>🌍 Ausschnitt:</b></label>
    <select id="kartenAnsicht" onchange="wechsleAnsicht(this.value)">
        <option id="opt-ch" value="schweiz">Schweiz</option>
        <option id="opt-eu" value="europa">Europa</option>
        <option id="opt-world" value="welt">Welt</option>
    </select>
</div>

<div id="map"></div>

<div id="lightbox" onclick="this.style.display='none'">
    <img id="lightbox-img" src="" alt="Vollbild Panorama">
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
<script src="lang.js"></script>

<script>
    let currentLang = 'de';
    let panoramenDaten = [];

    // Deine Google Sheet ID
    const SHEET_ID = "10pxYaSMyt5uDRjCF0DWjGEabe_a3YftdpChxYzyQJBo"; 

    const skalenBibliothek = {
        lydian: [130.81, 146.83, 164.81, 185.00, 196.00, 220.00, 246.94, 261.63, 293.66, 329.63, 369.99, 392.00, 440.00, 493.88, 523.25],
        minor: [130.81, 146.83, 155.56, 174.61, 196.00, 207.65, 233.08, 261.63, 293.66, 311.13, 349.23, 392.00, 415.30, 466.16, 523.25],
        pentatonic: [130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25]
    };

    const map = L.map('map').setView([46.8182, 8.2275], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    const markerClusterGroup = L.markerClusterGroup({
        maxClusterRadius: 40,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true
    });
    map.addLayer(markerClusterGroup);

    function wechsleAnsicht(ansicht) {
        if (ansicht === 'schweiz') map.flyTo([46.8182, 8.2275], 8);
        else if (ansicht === 'europa') map.flyTo([51.0, 10.0], 4);
        else if (ansicht === 'welt') map.flyTo([20.0, 0.0], 2);
    }

    function changeLanguage(lang) {
        currentLang = lang;
        
        // Menü-Labels übersetzen
        document.getElementById('lbl-sprache').innerText = text[lang].sprache;
        document.getElementById('lbl-view').innerHTML = `<b>${text[lang].ausschnitt}</b>`;
        document.getElementById('opt-ch').innerText = text[lang].schweiz;
        document.getElementById('opt-eu').innerText = text[lang].europa;
        document.getElementById('opt-world').innerText = text[lang].welt;
        
        // Popups im Cluster aktualisieren
        markerClusterGroup.eachLayer(layer => {
            if (layer.panoId) {
                const pano = panoramenDaten.find(p => p.id === layer.panoId);
                if (pano && layer.getPopup() && layer.isPopupOpen()) {
                    layer.setPopupContent(getPopupHTML(pano));
                }
            }
        });
    }

    function openLightbox(url) {
        document.getElementById('lightbox-img').src = url;
        document.getElementById('lightbox').style.display = 'flex';
    }

    async function ladePanoramenAusSheet() {
        try {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Panoramen`;
            const response = await fetch(url);
            if (!response.ok) throw new Error("Google Sheet konnte nicht geladen werden.");
            
            const csvText = await response.text();
            panoramenDaten = parseCSV(csvText);

            markerClusterGroup.clearLayers();

            panoramenDaten.forEach(pano => {
                const coords = pano.position ? pano.position.split(',').map(c => parseFloat(c.trim())) : [46.8182, 8.2275];
                
                const marker = L.marker(coords);
                marker.panoId = pano.id;
                
                marker.bindPopup(() => getPopupHTML(pano), { maxWidth: 300 });

                markerClusterGroup.addLayer(marker);

                window.activeSynth[pano.id] = {
                    peaks: parseInt(pano.peaks) || 4,
                    valleys: parseInt(pano.valleys) || 2,
                    spacing: parseInt(pano.spacing) || 35,
                    mode: pano.mode || 'chord',
                    scale: pano.scale || 'lydian',
                    wave: pano.wave || 'triangle',
                    volume: parseFloat(pano.volume) || 0.2,
                    duration: parseInt(pano.duration) || 5
                };
            });
        } catch (error) {
            console.error("Fehler beim Laden des Google Sheets:", error);
        }
    }

    function parseCSV(text) {
        const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length < 2) return [];
        
        const headers = lines[0].split(",").map(h => h.replace(/^["']|["']$/g, "").trim());
        let result = [];

        for (let i = 1; i < lines.length; i++) {
            let currentline = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            let obj = {};
            headers.forEach((h, index) => {
                let val = currentline[index] ? currentline[index].replace(/^["']|["']$/g, "").trim() : "";
                obj[h] = val;
            });
            result.push(obj);
        }
        return result;
    }

    function getPopupHTML(pano) {
        const s = window.activeSynth[pano.id] || pano;
        // Tooltip (title) greift jetzt auf die Übersetzung zu!
        return `
            <div class="popup-content">
                <h3 style="margin-top:0; margin-bottom:4px;">${pano.titel}</h3>
                <div style="font-size: 11px; color: #666; margin-bottom: 8px;">
                    📅 ${pano.datum} | ID: ${pano.id}
                </div>
                
                <div class="bild-container" onclick="openLightbox('${pano.bildUrl}')" title="${text[currentLang].vergroessern}">
                    <img src="${pano.bildUrl}" alt="${pano.titel}" class="popup-img" />
                    <canvas id="canvas_${pano.id}" class="punktOverlay"></canvas>
                </div>

                <div style="font-size: 12px; font-style: italic; margin-bottom: 8px; text-align: left;">
                    "${pano.kommentar}"
                </div>
                
                <div style="text-align: left;">
                    <label>${text[currentLang].gipfel} <b id="peak_${pano.id}">${s.peaks}</b></label>
                    <input type="range" min="0" max="10" value="${s.peaks}" 
                           oninput="document.getElementById('peak_${pano.id}').innerText = this.value; window.activeSynth['${pano.id}'].peaks = parseInt(this.value);">
                    
                    <label>${text[currentLang].taeler} <b id="tal_${pano.id}">${s.valleys}</b></label>
                    <input type="range" min="0" max="10" value="${s.valleys}" 
                           oninput="document.getElementById('tal_${pano.id}').innerText = this.value; window.activeSynth['${pano.id}'].valleys = parseInt(this.value);">

                    <label>${text[currentLang].abstand} <b id="space_${pano.id}">${s.spacing}</b>px</label>
                    <input type="range" min="10" max="100" step="5" value="${s.spacing}" 
                           oninput="document.getElementById('space_${pano.id}').innerText = this.value; window.activeSynth['${pano.id}'].spacing = parseInt(this.value);">

                    <label>${text[currentLang].modus}</label>
                    <select onchange="window.activeSynth['${pano.id}'].mode = this.value;">
                        <option value="chord" ${s.mode === 'chord' ? 'selected' : ''}>${text[currentLang].mod_gleich}</option>
                        <option value="lr" ${s.mode === 'lr' ? 'selected' : ''}>${text[currentLang].mod_lr}</option>
                        <option value="rl" ${s.mode === 'rl' ? 'selected' : ''}>${text[currentLang].mod_rl}</option>
                    </select>

                    <label>${text[currentLang].tonart}</label>
                    <select onchange="window.activeSynth['${pano.id}'].scale = this.value;">
                        <option value="lydian" ${s.scale === 'lydian' ? 'selected' : ''}>Lydisch (Träumend)</option>
                        <option value="minor" ${s.scale === 'minor' ? 'selected' : ''}>Moll (Melancholisch)</option>
                        <option value="pentatonic" ${s.scale === 'pentatonic' ? 'selected' : ''}>Pentatonik (Harmonisch)</option>
                    </select>

                    <label>${text[currentLang].wellenform}</label>
                    <select onchange="window.activeSynth['${pano.id}'].wave = this.value;">
                        <option value="triangle" ${s.wave === 'triangle' ? 'selected' : ''}>Triangle (Weich)</option>
                        <option value="sine" ${s.wave === 'sine' ? 'selected' : ''}>Sine (Rein)</option>
                        <option value="sawtooth" ${s.wave === 'sawtooth' ? 'selected' : ''}>Sawtooth (Scharf)</option>
                        <option value="square" ${s.wave === 'square' ? 'selected' : ''}>Square (Retro)</option>
                    </select>

                    <label>${text[currentLang].lautstaerke} <b id="vol_${pano.id}">${Math.round(s.volume * 100)}</b>%</label>
                    <input type="range" min="0.05" max="0.5" step="0.05" value="${s.volume}" 
                           oninput="document.getElementById('vol_${pano.id}').innerText = Math.round(this.value * 100); window.activeSynth['${pano.id}'].volume = parseFloat(this.value);">

                    <label>${text[currentLang].dauer} <b id="dur_${pano.id}">${s.duration}</b>s</label>
                    <input type="range" min="2" max="10" value="${s.duration}" 
                           oninput="document.getElementById('dur_${pano.id}').innerText = this.value; window.activeSynth['${pano.id}'].duration = parseInt(this.value);">
                </div>

                <button class="play-btn" onclick="playPanorama('${pano.id}', '${pano.arrayUrl}')">${text[currentLang].play}</button>
            </div>
        `;
    }

    window.activeSynth = {};
    ladePanoramenAusSheet();

    let audioCtx;

    function findeGipfel(kurve, anzahlPeaks, mindestAbstand) {
        let gefundenePeaks = [];
        for (let i = 1; i < kurve.length - 1; i++) {
            if (kurve[i] >= kurve[i - 1] && kurve[i] > kurve[i + 1]) {
                gefundenePeaks.push({ x: i, hoehe: kurve[i] }); 
            }
        }
        gefundenePeaks.sort((a, b) => b.hoehe - a.hoehe);
        let gefiltertePeaks = [];
        for (let gipfel of gefundenePeaks) {
            let zuNahe = false;
            for (let bestaetigt of gefiltertePeaks) {
                if (Math.abs(gipfel.x - bestaetigt.x) < mindestAbstand) { zuNahe = true; break; }
            }
            if (!zuNahe) gefiltertePeaks.push(gipfel);
            if (gefiltertePeaks.length >= anzahlPeaks) break;
        }
        return gefiltertePeaks;
    }

    function findeTaeler(kurve, anzahl, mindestAbstand) {
        let gefundeneTaeler = [];
        for (let i = 1; i < kurve.length - 1; i++) {
            if (kurve[i] <= kurve[i - 1] && kurve[i] < kurve[i + 1]) {
                gefundeneTaeler.push({ x: i, hoehe: kurve[i] });
            }
        }
        gefundeneTaeler.sort((a, b) => a.hoehe - b.hoehe);
        let gefilterteTaeler = [];
        for (let tal of gefundeneTaeler) {
            let zuNahe = false;
            for (let bestaetigt of gefilterteTaeler) {
                if (Math.abs(tal.x - bestaetigt.x) < mindestAbstand) { zuNahe = true; break; }
            }
            if (!zuNahe) gefilterteTaeler.push(tal);
            if (gefilterteTaeler.length >= anzahl) break;
        }
        return gefilterteTaeler;
    }

    async function playPanorama(panoId, dateiPfad) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        try {
            const response = await fetch(dateiPfad);
            if (!response.ok) throw new Error(`Array-Datei nicht gefunden!`);
            
            const daten = await response.json();
            const kurve = daten.kurve_y;
            const s = window.activeSynth[panoId];
            
            const aktuelleTonleiter = skalenBibliothek[s.scale];
            const topGipfel = findeGipfel(kurve, s.peaks, s.spacing);
            const tiefeTaeler = findeTaeler(kurve, s.valleys, s.spacing);
            let allePunkte = topGipfel.concat(tiefeTaeler);

            if (s.mode === 'lr') allePunkte.sort((a, b) => a.x - b.x);
            else if (s.mode === 'rl') allePunkte.sort((a, b) => b.x - a.x);

            const canvas = document.getElementById(`canvas_${panoId}`);
            if (canvas) {
                const ctx = canvas.getContext('2d');
                canvas.width = daten.bild_breite; 
                canvas.height = daten.bild_hoehe;
                ctx.clearRect(0, 0, canvas.width, canvas.height); 

                ctx.strokeStyle = 'rgba(255, 215, 0, 0.8)';
                ctx.lineWidth = 4;
                topGipfel.forEach(punkt => {
                    ctx.beginPath(); ctx.moveTo(punkt.x, 0); ctx.lineTo(punkt.x, canvas.height); ctx.stroke();
                });

                ctx.strokeStyle = 'rgba(0, 191, 255, 0.8)';
                tiefeTaeler.forEach(punkt => {
                    ctx.beginPath(); ctx.moveTo(punkt.x, 0); ctx.lineTo(punkt.x, canvas.height); ctx.stroke();
                });
            }

            allePunkte.forEach((punkt, indexPosition) => {
                const index = Math.floor((punkt.hoehe / 100) * (aktuelleTonleiter.length - 1));
                const freq = aktuelleTonleiter[index];

                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = s.wave;
                oscillator.frequency.value = freq;

                const startDelay = (s.mode === 'chord') ? 0 : (indexPosition * 0.25);
                const attackTime = 1.0;

                gainNode.gain.setValueAtTime(0, audioCtx.currentTime + startDelay);
                gainNode.gain.linearRampToValueAtTime(s.volume, audioCtx.currentTime + startDelay + attackTime); 
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + startDelay + s.duration);   

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start(audioCtx.currentTime + startDelay);
                oscillator.stop(audioCtx.currentTime + startDelay + s.duration + 0.1);
            });

        } catch (error) {
            console.error("Fehler beim Abspielen:", error);
            alert("Fehler: " + error.message); 
        }
    }
</script>

</body>
</html>
