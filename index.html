<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Panorama Synthesizer Karte</title>
    
    <!-- Das maßgeschneiderte Vektor-Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232c3e50'/><path d='M15,75 L35,30 L55,55 L75,20 L85,60' fill='none' stroke='%23FFD700' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/><circle cx='55' cy='55' r='8' fill='%2300BFFF'/></svg>">

    <!-- CSS für die Karte -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; position: relative; }
        
        #ui-menu {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 10px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            font-size: 13px;
            border: 1px solid #ddd;
        }
        
        #ui-menu select {
            width: 100%;
            padding: 4px;
            margin-top: 2px;
            margin-bottom: 6px;
            border-radius: 3px;
            border: 1px solid #ccc;
            font-size: 13px;
        }
        
        #ui-menu select:last-child { margin-bottom: 0; }
        #ui-menu label { font-size: 12px; color: #555; }

        .popup-content { text-align: center; }
        .popup-img { width: 100%; border-radius: 4px; display: block; }
        .bild-container { position: relative; width: 100%; margin-bottom: 10px; }
        #punktOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Kleinere Regler-Anpassungen fürs Pop-up */
        .popup-content select, .popup-content input[type="range"] {
            width: 100%;
            margin-top: 2px;
            margin-bottom: 6px;
        }
        .popup-content label {
            display: block;
            text-align: left;
            font-size: 12px;
            margin-top: 4px;
        }

        button.play-btn { 
            margin-top: 10px; padding: 10px 16px; cursor: pointer; 
            background: #2c3e50; color: white; border: none; 
            border-radius: 4px; font-weight: bold; width: 100%;
        }
        button.play-btn:hover { background: #1a252f; }
    </style>
</head>
<body>

<div id="ui-menu">
    <label for="langSelect">Sprache:</label>
    <select id="langSelect" onchange="changeLanguage(this.value)">
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="it">Italiano</option>
        <option value="en">English</option>
        <option value="uk">Українська</option>
        <option value="ru">Русский</option>
    </select>

    <label id="lbl-view" for="kartenAnsicht"><b>🌍 Ausschnitt:</b></label>
    <select id="kartenAnsicht" onchange="wechsleAnsicht(this.value)">
        <option id="opt-ch" value="schweiz">Schweiz</option>
        <option id="opt-eu" value="europa">Europa</option>
        <option id="opt-world" value="welt">Welt</option>
    </select>
</div>

<div id="map"></div>

<!-- Lade Leaflet & Sprachen -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="lang.js"></script>

<script>
    // Globale Parameter für die GUI
    window.currentPeaks = 4;
    window.currentValleys = 2;
    window.currentWave = 'triangle';
    window.currentVolume = 0.2;
    window.currentDuration = 5;
    let currentLang = 'de';

    const map = L.map('map').setView([46.8182, 8.2275], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    function wechsleAnsicht(ansicht) {
        if (ansicht === 'schweiz') map.flyTo([46.8182, 8.2275], 8);
        else if (ansicht === 'europa') map.flyTo([51.0, 10.0], 4);
        else if (ansicht === 'welt') map.flyTo([20.0, 0.0], 2);
    }

    function changeLanguage(lang) {
        currentLang = lang;
        document.getElementById('lbl-view').innerHTML = `<b>${text[lang].ausschnitt}</b>`;
        document.getElementById('opt-ch').innerText = text[lang].schweiz;
        document.getElementById('opt-eu').innerText = text[lang].europa;
        document.getElementById('opt-world').innerText = text[lang].welt;
        marker.setPopupContent(getPopupHTML());
    }

    const basisName = 'IMG_2828';
    const jsonPfad = `daten/${basisName}_array.json`;
    const bildPfad = `daten/${basisName}_linie.jpg`;
    
    const marker = L.marker([46.5595, 7.9666]).addTo(map);

    function getPopupHTML() {
        return `
            <div class="popup-content">
                <h3 style="margin-top:0; margin-bottom:8px;">${text[currentLang].kontur}</h3>
                
                <div class="bild-container">
                    <img src="${bildPfad}" alt="Bergsilhouette" class="popup-img" />
                    <canvas id="punktOverlay"></canvas>
                </div>
                
                <div style="text-align: left;">
                    <label>${text[currentLang].gipfel} <b id="peakWert">${window.currentPeaks}</b></label>
                    <input type="range" id="peakSlider" min="0" max="10" value="${window.currentPeaks}" 
                           oninput="document.getElementById('peakWert').innerText = this.value; window.currentPeaks = this.value;">
                    
                    <label>${text[currentLang].taeler} <b id="talWert">${window.currentValleys}</b></label>
                    <input type="range" id="talSlider" min="0" max="10" value="${window.currentValleys}" 
                           oninput="document.getElementById('talWert').innerText = this.value; window.currentValleys = this.value;">

                    <label>${text[currentLang].wellenform}</label>
                    <select id="waveSelect" onchange="window.currentWave = this.value;">
                        <option value="triangle" ${window.currentWave === 'triangle' ? 'selected' : ''}>Triangle (Weich)</option>
                        <option value="sine" ${window.currentWave === 'sine' ? 'selected' : ''}>Sine (Rein)</option>
                        <option value="sawtooth" ${window.currentWave === 'sawtooth' ? 'selected' : ''}>Sawtooth (Scharf)</option>
                        <option value="square" ${window.currentWave === 'square' ? 'selected' : ''}>Square (Retro)</option>
                    </select>

                    <label>${text[currentLang].lautstaerke} <b id="volWert">${Math.round(window.currentVolume * 100)}</b>%</label>
                    <input type="range" id="volSlider" min="0.05" max="0.5" step="0.05" value="${window.currentVolume}" 
                           oninput="document.getElementById('volWert').innerText = Math.round(this.value * 100); window.currentVolume = parseFloat(this.value);">

                    <label>${text[currentLang].dauer} <b id="durWert">${window.currentDuration}</b>s</label>
                    <input type="range" id="durSlider" min="2" max="10" value="${window.currentDuration}" 
                           oninput="document.getElementById('durWert').innerText = this.value; window.currentDuration = parseInt(this.value);">
                </div>

                <button class="play-btn" onclick="playPanorama('${jsonPfad}')">${text[currentLang].play}</button>
            </div>
        `;
    }
    
    marker.bindPopup(getPopupHTML(), { maxWidth: 300 });

    let audioCtx;
    const tonleiter = [130.81, 146.83, 164.81, 185.00, 196.00, 220.00, 246.94, 261.63, 293.66, 329.63, 369.99, 392.00, 440.00, 493.88, 523.25];

    function findeGipfel(kurve, anzahlPeaks) {
        let gefundenePeaks = [];
        for (let i = 1; i < kurve.length - 1; i++) {
            if (kurve[i] >= kurve[i - 1] && kurve[i] > kurve[i + 1]) {
                gefundenePeaks.push({ x: i, hoehe: kurve[i] }); 
            }
        }
        gefundenePeaks.sort((a, b) => b.hoehe - a.hoehe);
        return gefundenePeaks.slice(0, anzahlPeaks);
    }

    function findeTaeler(kurve, anzahl) {
        let gefundeneTaeler = [];
        for (let i = 1; i < kurve.length - 1; i++) {
            if (kurve[i] <= kurve[i - 1] && kurve[i] < kurve[i + 1]) {
                gefundeneTaeler.push({ x: i, hoehe: kurve[i] });
            }
        }
        gefundeneTaeler.sort((a, b) => a.hoehe - b.hoehe);
        return gefundeneTaeler.slice(0, anzahl);
    }

    async function playPanorama(dateiPfad) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        try {
            const response = await fetch(dateiPfad);
            if (!response.ok) throw new Error(`Datei nicht gefunden! HTTP-Status: ${response.status}`);
            
            const daten = await response.json();
            const kurve = daten.kurve_y;

            // GUI-Werte auslesen
            const anzahlGipfel = parseInt(window.currentPeaks);
            const anzahlTaeler = parseInt(window.currentValleys);
            const waveType = window.currentWave;
            const maxVol = parseFloat(window.currentVolume);
            const totalDuration = parseInt(window.currentDuration);
            
            const topGipfel = findeGipfel(kurve, anzahlGipfel);
            const tiefeTaeler = findeTaeler(kurve, anzahlTaeler);
            const allePunkte = topGipfel.concat(tiefeTaeler);

            const canvas = document.getElementById('punktOverlay');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                canvas.width = daten.bild_breite; 
                canvas.height = daten.bild_hoehe;
                ctx.clearRect(0, 0, canvas.width, canvas.height); 

                ctx.strokeStyle = 'rgba(255, 215, 0, 0.8)';
                ctx.lineWidth = 4;
                topGipfel.forEach(punkt => {
                    ctx.beginPath();
                    ctx.moveTo(punkt.x, 0); 
                    ctx.lineTo(punkt.x, canvas.height); 
                    ctx.stroke();
                });

                ctx.strokeStyle = 'rgba(0, 191, 255, 0.8)';
                tiefeTaeler.forEach(punkt => {
                    ctx.beginPath();
                    ctx.moveTo(punkt.x, 0);
                    ctx.lineTo(punkt.x, canvas.height);
                    ctx.stroke();
                });
            }

            // Synthesizer-Parameter dynamisch anwenden
            allePunkte.forEach(punkt => {
                const index = Math.floor((punkt.hoehe / 100) * (tonleiter.length - 1));
                const freq = tonleiter[index];

                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = waveType; // Nutzt die Wellenform aus der GUI
                oscillator.frequency.value = freq;

                // Dynamische Hüllkurve basierend auf der GUI-Dauer und Lautstärke
                const attackTime = 1.5;
                const releaseTime = totalDuration - 0.5;

                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(maxVol, audioCtx.currentTime + attackTime); 
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + totalDuration);   

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + totalDuration + 0.1);
            });

        } catch (error) {
            console.error("Fehler beim Laden:", error);
            alert("Fehler: " + error.message); 
        }
    }
</script>

</body>
</html>
