<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Panorama Synthesizer Karte</title>
    <!-- CSS für die Karte -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        .popup-content { text-align: center; }
        /* NEU: Damit das Bild schön in die Sprechblase passt */
        .popup-img { width: 100%; max-width: 300px; border-radius: 4px; margin-bottom: 10px; }
        button { margin-top: 10px; padding: 8px 16px; cursor: pointer; background: #333; color: white; border: none; border-radius: 4px;}
        button:hover { background: #555; }
    </style>
</head>
<body>

<!-- Der Bereich, in dem die Karte gezeichnet wird -->
<div id="map"></div>

<!-- JavaScript für die Karte -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Dein eigenes Synthesizer-Skript -->
<script>
    // 1. Karte initialisieren (Zentriert auf die Schweiz)
    const map = L.map('map').setView([46.8182, 8.2275], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // 2. Audio Context und Tonleiter (Lydisch) vorbereiten
    let audioCtx;
    const tonleiter = [130.81, 146.83, 164.81, 185.00, 196.00, 220.00, 246.94, 261.63, 293.66, 329.63, 369.99, 392.00, 440.00, 493.88, 523.25];

// 3. Hilfsfunktion: Gipfel in der Kurve finden
    function findeGipfel(kurve, anzahlPeaks) {
        let gefundenePeaks = [];
        for (let i = 1; i < kurve.length - 1; i++) {
            // HIER IST DIE ÄNDERUNG: >= statt > beim ersten Vergleich
            if (kurve[i] >= kurve[i - 1] && kurve[i] > kurve[i + 1]) {
                gefundenePeaks.push(kurve[i]);
            }
        }
        gefundenePeaks.sort((a, b) => b - a);
        return gefundenePeaks.slice(0, anzahlPeaks);
    }

// 4. Marker auf die Karte setzen
    const marker = L.marker([46.5595, 7.9666]).addTo(map);
    
    // Wir definieren die Dateinamen für JSON und Bild
    const basisName = 'IMG_2828';
    const jsonPfad = `daten/${basisName}_array.json`;
    const bildPfad = `daten/${basisName}_linie.jpg`;

    // Popup mit Bild und Button
    marker.bindPopup(`
        <div class="popup-content">
            <h3>Panorama Kontur</h3>
            <img src="${bildPfad}" alt="Bergsilhouette" class="popup-img" />
            <br>
            <button onclick="playPanorama('${jsonPfad}')">🎵 Akkord abspielen</button>
        </div>
    `, { maxWidth: 320 }); // Macht das Popup breit genug für das Bild
    

    // 5. Die Synthesizer-Logik mit Anti-Blockier-Trick
    async function playPanorama(dateiPfad) {
        
        // A. Synthesizer initialisieren und explizit aufwecken (gegen Browser-Blockaden)
        if (!audioCtx) { 
            audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
        }
        if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
        }

        try {
            console.log("Versuche Daten zu laden von:", dateiPfad);
            
            // B. Daten laden
            const response = await fetch(dateiPfad);
            if (!response.ok) {
                throw new Error(`Datei nicht gefunden! HTTP-Status: ${response.status}`);
            }
            const daten = await response.json();
            const kurve = daten.kurve_y;

            // C. Die höchsten Gipfel berechnen
            const topGipfel = findeGipfel(kurve, 4);
            console.log("Gefundene Gipfel-Höhen (0-100):", topGipfel);

            // D. Höhen in Frequenzen umwandeln und abspielen
            topGipfel.forEach(hoehe => {
                // Welcher Tonleiter-Index passt zur Höhe?
                const index = Math.floor((hoehe / 100) * (tonleiter.length - 1));
                const freq = tonleiter[index];

                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'triangle';
                oscillator.frequency.value = freq;

                // Sanftes Ein- und Ausblenden des Tons
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 1.5); 
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 4.5);   

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 5);
            });

        } catch (error) {
            console.error("HILFE, ein Fehler beim Laden:", error);
            // Diese kleine Box poppt auf, falls die Datei auf GitHub nicht gefunden wird!
            alert("Fehler: " + error.message); 
        }
    }
</script>

</body>
</html>
