<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Panorama Synthesizer</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e1e1e'/><path d='M15,75 L35,30 L55,55 L75,20 L85,60' fill='none' stroke='%23FFD700' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/><circle cx='55' cy='55' r='8' fill='%2300BFFF'/></svg>">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
    
    <!-- CSS  -->
    <link rel="stylesheet" href="style.css?v=6" />
</head>
<body>

<script>
    window.onerror = function(msg, src, line) {
        if (!msg.includes("favicon")) alert("Code-Fehler in Zeile " + line + ": " + msg);
    };
</script>

<!-- Das Menü wurde kompakter gemacht -->
<div id="ui-menu">
    <label id="lbl-sprache" for="langSelect">Sprache:</label>
    <select id="langSelect" onchange="changeLanguage(this.value)">
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="it">Italiano</option>
        <option value="en">English</option>
        <option value="uk">Українська</option>
        <option value="ru">Русский</option>
    </select>
    
    <div class="menu-divider"></div>
    
    <label id="lbl-view" for="kartenAnsicht">🌍 Ausschnitt:</label>
    <select id="kartenAnsicht" onchange="wechsleAnsicht(this.value)">
        <option id="opt-ch" value="schweiz">Schweiz</option>
        <option id="opt-eu" value="europa">Europa</option>
        <option id="opt-world" value="welt">Welt</option>
    </select>
    <div class="menu-divider"></div>
    <button id="btn-vinyl-mode" onclick="toggleVinylMode()">Vinyl</button>
    <div class="menu-divider"></div>
    <span id="user-display" style="color: #00BFFF; font-size: 11px; cursor: pointer; text-transform: uppercase; margin-right: 8px;" onclick="changeUserName()" title="Namen ändern">👤 Gast</span>    
    <div class="menu-divider"></div>
    <a href="datenschutz.html" target="_blank" style="color: #888; font-size: 11px; text-decoration: none; margin-left: 4px; text-transform: uppercase;">Datenschutz</a>    
</div>

<div id="vinyl-menu" style="display: none;">
    <div style="display: flex; gap: 10px; align-items: stretch; width: 100%;">
        <!-- Speed Fader -->
        <div class="fader-box te-tooltip-container" id="vinyl-speed-box" style="height: auto; border: 1px solid #333; background: #e5e0d8; min-width: 40px;">
            <div class="te-tooltip" id="tt_vinyl_speed"><span class="tt-label">Speed: </span><span id="tt_val_vinyl_speed">33</span><span class="tt-unit"> RPM</span></div>
            <div class="fader-icon-container" style="color: #1a1a1a;">◷</div>
            <div class="fader-container" id="vinyl-fader-container">
                <input type="range" id="range_vinyl_speed" class="te-fader" min="1" max="48" step="1" value="33" oninput="document.getElementById('tt_val_vinyl_speed').innerText = this.value; if(window.updateVinylSpeed) window.updateVinylSpeed(this.value); if(window.vinylAiSequence) { window.vinylAiSequence = null; let btn = document.getElementById('btn-ai-compose'); if(btn){ btn.style.background=''; btn.style.color=''; } }">
            </div>
        </div>

        <!-- Mutation Fader -->
        <div class="fader-box te-tooltip-container" id="vinyl-mutation-box" style="height: auto; border: 1px solid #333; background: #e5e0d8; min-width: 40px;">
            <div class="te-tooltip" id="tt_vinyl_mutation"><span class="tt-label" id="lbl_mutation">Mutation: </span><span id="tt_val_vinyl_mutation">1.0</span><span class="tt-unit"></span></div>
            <div class="fader-icon-container" style="color: #1a1a1a;">⚄</div>
            <div class="fader-container" id="mutation-fader-container">
                <input type="range" id="range_vinyl_mutation" class="te-fader" min="0.5" max="1.5" step="0.1" value="1.0" oninput="document.getElementById('tt_val_vinyl_mutation').innerText = parseFloat(this.value).toFixed(1); if(window.vinylAiSequence) { window.vinylAiSequence = null; let btn = document.getElementById('btn-ai-compose'); if(btn){ btn.style.background=''; btn.style.color=''; } }">
            </div>
        </div>

        <div id="vinyl-canvas-container" style="flex: 1; position: relative;">
            <canvas id="vinyl-canvas" width="200" height="200" style="position: absolute; top:0; left:0; width:100%; height:100%;"></canvas>
            <canvas id="vinyl-overlay-canvas" width="200" height="200" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></canvas>
        </div>
    </div>

    <div style="display: flex; width: 100%; flex-direction: row; gap: 0; border: 1px solid #1a1a1a; margin-top: 5px;">
        <select id="sel_vinyl_octaves" onchange="if(window.vinylAiSequence) { window.vinylAiSequence = null; let btn = document.getElementById('btn-ai-compose'); if(btn){ btn.style.background=''; btn.style.color=''; } }" style="flex: 1; border: none; border-right: 1px solid #333; background: #111; color: #00BFFF; padding: 4px; outline: none; cursor: pointer; text-transform: uppercase; font-size: 11px;">
            <option value="1">1 Oktave</option>
            <option value="2">2 Oktaven</option>
            <option value="3">3 Oktaven</option>
            <option value="4" selected>4 Oktaven</option>
            <option value="5">5 Oktaven</option>
            <option value="6">6 Oktaven</option>
        </select>
        <select id="sel_vinyl_scale" onchange="if(window.vinylAiSequence) { window.vinylAiSequence = null; let btn = document.getElementById('btn-ai-compose'); if(btn){ btn.style.background=''; btn.style.color=''; } }" style="flex: 1; border: none; border-right: 1px solid #333; background: #111; color: #00BFFF; padding: 4px; outline: none; cursor: pointer; text-transform: uppercase; font-size: 11px;">
            <option value="major">Dur</option>
            <option value="minor">Moll</option>
            <option value="lydian">Lydisch</option>
            <option value="dorian">Dorisch</option>
            <option value="pentatonic" selected>Pentatonik</option>
            <option value="hirajoshi">Hirajōshi</option>
        </select>
        <select id="sel_vinyl_wave" onchange="if(window.vinylAiSequence) { window.vinylAiSequence = null; let btn = document.getElementById('btn-ai-compose'); if(btn){ btn.style.background=''; btn.style.color=''; } }" style="flex: 1; border: none; background: #111; color: #00BFFF; padding: 4px; outline: none; cursor: pointer; text-transform: uppercase; font-size: 11px;">
            <option value="sine">Sinus</option>
            <option value="triangle">Dreieck</option>
            <option value="sawtooth">Sägezahn</option>
            <option value="square">Rechteck</option>
            <option value="organ">Orgel</option>
            <option value="darkpad">Dark Pad</option>
            <option value="chime" selected>Glöckchen</option>
            <option value="detuned_saw">Verstimmte Säge</option>
            <option value="noise">Rauschen</option>
        </select>
    </div>

    <div id="vinyl-controls">
        <button class="icon-btn" id="btn-vinyl-generate" onclick="generateVinyl()" title="Generieren">⚄</button>
        <button class="icon-btn" id="btn-ai-compose" onclick="aiComposeVinyl()" title="AI Compose" style="font-size: 11px; padding: 0 5px;">[ AI COMPOSE ]</button>
        <button class="icon-btn" id="btn-ai-play" onclick="playAiVinyl()" title="AI Play" style="font-size: 11px; padding: 0 5px;">[ AI PLAY ]</button>
        <button class="icon-btn" id="btn-vinyl-play" onclick="playVinyl()" title="Abspielen">▶</button>
        <button class="icon-btn" id="btn-vinyl-load" onclick="loadVinyl()" title="Laden">⇪</button>
        <button class="icon-btn" id="btn-vinyl-save" onclick="saveVinyl()" title="Speichern">⚑</button>
    </div>


    <!-- MIDI K.O. II Section -->
    <div style="width: 100%; border: 1px solid #1a1a1a; margin-top: 10px; background: #e5e0d8; padding: 5px; box-sizing: border-box;">
        <div style="font-size: 11px; text-transform: uppercase; margin-bottom: 5px; color: #1a1a1a; font-weight: bold; text-align: center;">[ MIDI K.O. II ]</div>
        <div style="display: flex; gap: 5px; width: 100%;">
            <select id="sel_midi_out" onchange="window.selectMidiOutput()" style="flex: 1; border: none; background: #111; color: #00BFFF; padding: 4px; outline: none; cursor: pointer; text-transform: uppercase; font-size: 11px; font-family: monospace; border-radius: 0;">
                <option value="">-- NO MIDI OUT --</option>
            </select>
            <select id="sel_midi_in" onchange="window.selectMidiInput()" style="flex: 1; border: none; background: #111; color: #00BFFF; padding: 4px; outline: none; cursor: pointer; text-transform: uppercase; font-size: 11px; font-family: monospace; border-radius: 0;">
                <option value="">-- NO MIDI IN --</option>
            </select>
            <input type="number" id="num_midi_channel" value="1" min="1" max="16" title="MIDI Channel" style="width: 40px; border: none; background: #111; color: #00BFFF; padding: 4px; text-align: center; outline: none; font-family: monospace; font-size: 11px; border-radius: 0;">
        </div>
        <button id="btn-init-midi" class="icon-btn" onclick="window.initMIDI()" style="width: 100%; margin-top: 5px; font-size: 11px; padding: 4px; border-radius: 0; font-family: monospace;">[ CONNECT MIDI ]</button>
    </div>

    <div id="vinyl-presets-list" style="margin-top: 10px; max-height: 100px; overflow-y: auto; overflow-x: hidden; width: 100%; box-sizing: border-box;"></div>
</div>

<div id="map-container">
    <div id="map"></div>
    <div id="map-label">[ MAP_DATA ]</div>

    <div id="map-overlay-fullscreen" style="display: none;">
        <button id="map-overlay-close" onclick="window.closeMapOverlay()">✕</button>
        <div id="map-overlay-content"></div>
    </div>
</div>
<div id="lightbox" onclick="this.style.display='none'"><img id="lightbox-img" src="" alt=""></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<!-- PapaParse Bibliothek für den CSV-Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<!-- Magenta Music für KI-Melodie-Generierung -->
    <script src="https://cdn.jsdelivr.net/npm/@magenta/music@1.23.1/dist/magentamusic.min.js"></script>

<!-- Logik v=3 -->
<script src="lang.js?v=10"></script>
<script src="config.js?v=6"></script>
<script src="api.js?v=6"></script>
<script src="audio.js?v=2"></script>
<script src="midi.js"></script>
<script src="ui.js?v=11"></script>
    
</body>
</html>
